version: "3"

services:
  backend:
    image: ghcr.io/devofs2/pro_erpnext_feature-cicd:latest
    networks:
      - coolify
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: as0gs04wkc8o8k8ww44kkwgs
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
      DB_USER: root
      DB_PASSWORD: admin
      DB_NAME: test

  configurator:
    image: ghcr.io/devofs2/pro_erpnext_feature-cicd:latest
    networks:
      - coolify
    deploy:
      restart_policy:
        condition: on-failure
    entrypoint: ["bash", "-c"]
    command: ["bench set-config -g db_host $$DB_HOST; bench set-config -gp db_port $$DB_PORT;"]
    environment:
      DB_HOST: as0gs04wkc8o8k8ww44kkwgs
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
      DB_USER: root
      DB_PASSWORD: admin
      DB_NAME: test
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: ghcr.io/devofs2/pro_erpnext_feature-cicd:latest
    networks:
      - coolify
    deploy:
      restart_policy:
        condition: on-failure
    entrypoint: ["bash", "-c"]
    command: ["wait-for-it -t 120 as0gs04wkc8o8k8ww44kkwgs:3306"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  frontend:
    image: ghcr.io/devofs2/pro_erpnext_feature-cicd:latest
    networks:
      - coolify
    depends_on:
      - websocket
    deploy:
      restart_policy:
        condition: on-failure
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erpnext-feature-cicd.rule=Host(`cwo848sgsowsk04o40w4ckwg.161.97.174.134.sslip.io`)"
      - "traefik.http.services.erpnext-feature-cicd.loadbalancer.server.port=8080"

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - coolify
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - coolify
    deploy:
      restart_policy:
        condition: on-failure

  scheduler:
    image: ghcr.io/devofs2/pro_erpnext_feature-cicd:latest
    networks:
      - coolify
    deploy:
      restart_policy:
        condition: on-failure
    command: ["bench", "schedule"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  websocket:
    image: ghcr.io/devofs2/pro_erpnext_feature-cicd:latest
    networks:
      - coolify
    deploy:
      restart_policy:
        condition: on-failure

networks:
  coolify:
    external: true

volumes:
  sites:
  logs:
  redis-queue-data: