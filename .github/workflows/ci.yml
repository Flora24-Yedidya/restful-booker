name: ERPNext CI

on:
  push:
    branches:
      - dev
      - test
  pull_request:
    branches:
      - dev
  workflow_dispatch: # Déclencheur manuel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/dev') && !startsWith(github.ref, 'refs/heads/test') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get Branch Name
        run: |
          # Récupérer le nom de la branche
          if [[ -n "$GITHUB_HEAD_REF" ]]; then
            branch_name="${GITHUB_HEAD_REF}"
          else
            branch_name=$(git rev-parse --abbrev-ref HEAD)
          fi

          # Remplacer "/" par "-" pour le nom de l'image Docker
          branch_sanitize=$(echo "$branch_name" | sed "s/\//-/g")

          # Définir les variables d'environnement
          echo "Nom de la branche : $branch_name"
          echo "Branch_sanitize : $branch_sanitize"
          echo "BRANCH_NAME=$branch_name" >> $GITHUB_ENV
          echo "BRANCH_SANITIZE=$branch_sanitize" >> $GITHUB_ENV
          echo "BRANCH_NAME=$BRANCH_NAME" >> .env
          echo "BRANCH_SANITIZE=$BRANCH_SANITIZE" >> .env
          
      - name: Upload Docker Compose & Env Files
        uses: actions/upload-artifact@v4
        with:
          name: env files
          path: |
            .env
            .github/scripts/  
          overwrite: true
          include-hidden-files: true

  deploy-app:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
      PROJECT_UUID: "oo0o044sk8woco480k8occk0"
      BRANCH_NAME: $BRANCH_NAME
      BRANCH_SANITIZE: $BRANCH_SANITIZE
      SERVER_UUID: ${{ secrets.SERVER_UUID}} # UUID du serveur
      MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD}}  # Mot de passe root de MariaDB
      MARIADB_USER: ${{ secrets. MARIADB_USER}}  # Utilisateur MariaDB
      MARIADB_PASSWORD: ${{ secrets.MARIADB_PASSWORD}}  # Mot de passe de l'utilisateur


    steps:
      - name: Download Docker Compose & Env Files
        uses: actions/download-artifact@v4
        with:
          name: env files
          path: .
      
      - name: Install jq
        run: sudo apt-get install jq -y

      - name: Load environment variables
        run: |
          cat .env >> $GITHUB_ENV
    
      - name: Set execute permissions
        run: chmod +x .github/scripts/*.sh

      - name: delete & create database
        id: create_db
        run: |
         DB_UUID=$(./.github/scripts/create_database.sh)
         echo "DB_UUID=$DB_UUID" >> $GITHUB_ENV
    
      - name: Check app
        id: check_app
        run: |
          RESULT=$(./.github/scripts/check_and_create_app.sh $PROJECT_UUID $BRANCH_NAME $BRANCH_SANITIZE $DB_UUID)
          echo "$RESULT"
          echo "APP_UUID=$RESULT" >> $GITHUB_ENV
