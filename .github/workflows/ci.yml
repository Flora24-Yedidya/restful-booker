name: CI/CD

on:
  push:
    branches:
      - '*'
  pull_request:
      branches:
        - main
  workflow_dispatch: # Déclencheur manuel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/dev') && !startsWith(github.ref, 'refs/heads/test') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get Branch Name
        run: |
          if [[ -n "$GITHUB_HEAD_REF" ]]; then
            branch_name="${GITHUB_HEAD_REF}"
          else
            branch_name=$(git rev-parse --abbrev-ref HEAD)
          fi

          branch_sanitize=$(echo "$branch_name" | sed "s/\//-/g")

          echo "BRANCH_NAME=$branch_name" >> $GITHUB_ENV
          echo "BRANCH_SANITIZE=$branch_sanitize" >> $GITHUB_ENV
  
      - name: Build & Push Docker Image
        run: |
          #sed -i "s|\${AUTH_TOKEN}|${{ secrets.AUTH_TOKEN }}|g" ./resources/apps.json
          IMAGE_NAME="ghcr.io/devofs2/pro_erpnext_$BRANCH_SANITIZE:latest"
          echo "Building and pushing image: $IMAGE_NAME"
          echo "REGISTRY_PASSWORD=${{ secrets.GHCR_TOKEN }}" >> GITHUB_ENV
          echo "IMAGE_NAME=$IMAGE_NAME" >> GITHUB_ENV

      # - name: Upload Docker Compose & Env Files
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: docker-compose-files
      #     path: |
      #       docker-compose.yml
      #       .env
      #       .github/scripts/  
      #     overwrite: true
      #     include-hidden-files: true

  deploy-app:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: checkout repository
        uses: actions/checkout@v3
      
      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Create app
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
          PROJECT_UUID: "v0ggs00w4kgskcksgkgkk8oc"
          BRANCH_NAME: $BRANCH_NAME
          IMAGE_NAME: $IMAGE_NAME
          REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
        run: |
          # Appel API pour créer l'application
          RESPONSE=$(curl -s -X POST "$COOLIFY_URL/api/v1/applications/private-deploy-key" \
            --header "Authorization: Bearer $COOLIFY_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{
              "project_uuid": "'"$PROJECT_UUID"'",
              "server_uuid": "g04w4sg0csocwgocwgkgg44k",
              "environment_name": "development",
              "private_key_uuid": "ecokkkckk8cccwgoww00ogg0",
              "git_repository": "git@github.com:devofs2/pro_erpnext.git",
              "git_branch": "'"$BRANCH_NAME"'",
              "ports_exposes": "8081",
              "build_pack": "dockercompose",
              "name": "'"$BRANCH_NAME"'",
              "docker_compose_location": "docker-compose.yml",
              "docker_compose_custom_build_command": "echo ${REGISTRY_PASSWORD} | docker login ghcr.io -u devofs2 --password-stdin && docker pull ${IMAGE_NAME}",
              "docker_compose_custom_start_command": "docker compose up -d",
              "manual_webhook_secret_github": "hello",
              "instant_deploy": true
            }')

          # Extraire l'UUID de la réponse
          APP_UUID=$(echo "$RESPONSE" | jq -r '.uuid')

          # Vérifier si l'UUID est bien récupéré
          if [[ -z "$APP_UUID" || "$APP_UUID" == "null" ]]; then
            echo "Erreur: Impossible de récupérer l'UUID. Réponse API: $RESPONSE"
            exit 1
          fi

          # Retourner l'UUID
          echo "UUID de l'application : $APP_UUID"     

