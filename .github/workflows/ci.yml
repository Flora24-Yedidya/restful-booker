#name: Get Branch Name

on:
  push:
    branches:
      - '**'  # Pour toutes les branches
  pull_request:
    branches:
      - '**'  # Pour toutes les PR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/dev') && !startsWith(github.ref, 'refs/heads/test') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get Branch Name
        run: |
          # Récupérer le nom de la branche
          if [[ -n "$GITHUB_HEAD_REF" ]]; then
            branch_name="${GITHUB_HEAD_REF}"
          else
            branch_name=$(git rev-parse --abbrev-ref HEAD)
          fi

          # Remplacer "/" par "-" pour le nom de l'image Docker
          branch_sanitize=$(echo "$branch_name" | sed "s/\//-/g")

          # Définir les variables d'environnement
          echo "Nom de la branche : $branch_name"
          echo "Branch_sanitize : $branch_sanitize"
          echo "BRANCH_NAME=$branch_name" >> $GITHUB_ENV
          echo "BRANCH_SANITIZE=$branch_sanitize" >> $GITHUB_ENV


  deploy-app:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      COOLIFY_URL: https://coolify2.ofs.bj
      COOLIFY_API_KEY: 1|6rnyiYLZtJRXYwiyiVRv3m3ytr6GOGspcTKoC4HTa8e42f6f
      PROJECT_UUID: "v0ggs00w4kgskcksgkgkk8oc"
      BRANCH_NAME: feature/cicd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Install jq
        run: sudo apt-get install jq -y
      
      - name: Set execute permissions
        run: chmod +x .github/scripts/*.sh

      - name: Check app
        run: |
          APP_UUID=$(./.github/scripts/check_and_deploy.sh $COOLIFY_URL $PROJECT_UUID $BRANCH_NAME)
          echo "APP_UUID=$APP_UUID"

          - name: Set execute permissions
          run: chmod +x .github/scripts/*.sh
    
      - name: Check app
        id: check_app
        run: |
          # Capture the output of check_and_deploy.sh and extract only the UUID
          APP_UUID=$(./.github/scripts/check_and_deploy.sh $COOLIFY_URL $PROJECT_UUID $BRANCH_NAME | grep -oP '(?<=UUID: )[a-zA-Z0-9]+')
          
          # Debugging: Check what is captured in APP_UUID
          echo "APP_UUID after extraction: $APP_UUID"
          
          # Make sure APP_UUID is not empty or invalid
          if [[ -z "$APP_UUID" || "$APP_UUID" == "null" ]]; then
            echo "Erreur: L'UUID est invalide"
            exit 1
          fi
  
          # Set the APP_UUID to GitHub environment variable
          echo "APP_UUID=$APP_UUID" >> $GITHUB_ENV
  
      - name: Afficher l'UUID de l'application
        run: |
          echo "L'UUID de l'application est: $APP_UUID"
          echo "✅ Application prête pour le déploiement : $APP_UUID"

