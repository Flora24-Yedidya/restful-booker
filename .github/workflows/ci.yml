#name: Get Branch Name

on:
  push:
    branches:
      - '**'  # Pour toutes les branches
  pull_request:
    branches:
      - '**'  # Pour toutes les PR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/dev') && !startsWith(github.ref, 'refs/heads/test') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get Branch Name
        run: |
          # Récupérer le nom de la branche
          if [[ -n "$GITHUB_HEAD_REF" ]]; then
            branch_name="${GITHUB_HEAD_REF}"
          else
            branch_name=$(git rev-parse --abbrev-ref HEAD)
          fi

          # Remplacer "/" par "-" pour le nom de l'image Docker
          branch_sanitize=$(echo "$branch_name" | sed "s/\//-/g")

          # Définir les variables d'environnement
          echo "Nom de la branche : $branch_name"
          echo "Branch_sanitize : $branch_sanitize"
          echo "BRANCH_NAME=$branch_name" >> $GITHUB_ENV
          echo "BRANCH_SANITIZE=$branch_sanitize" >> $GITHUB_ENV


  deploy-app:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      COOLIFY_URL: https://coolify2.ofs.bj
      COOLIFY_API_KEY: 1|6rnyiYLZtJRXYwiyiVRv3m3ytr6GOGspcTKoC4HTa8e42f6f
      PROJECT_UUID: "v0ggs00w4kgskcksgkgkk8oc"
      BRANCH_NAME: feature/cicd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Install jq
        run: sudo apt-get install jq -y

      - name: Load environment variables
        run: |
          set -a
          source .env
          set +a

      - name: Set execute permissions
        run: chmod +x .github/scripts/*.sh

      - name: Replace variables in create.sh
        run: |
          sed -i "s|\$REGISTRY_PASSWORD|${REGISTRY_PASSWORD}|g" .github/scripts/create_application.sh
          sed -i "s|\$GHRC_OWNER|${GHRC_OWNER}|g" .github/scripts/create_application.sh
          sed -i "s|\$IMAGE_NAME|${IMAGE_NAME}|g" .github/scripts/create_application.sh
      
      - name: Debug environment variables
        run: |
          echo "REGISTRY_PASSWORD=${REGISTRY_PASSWORD}"
          echo "GHRC_OWNER=${GHRC_OWNER}"
          echo "IMAGE_NAME=${IMAGE_NAME}"
          cat .github/scripts/create_application.sh

      - name: Run deployment script
        run: .github/scripts/create_application.sh "$PROJECT_UUID" "$BRANCH_NAME"
      

      

