name: CI/CD

on:
  push:
    branches:
      - '*'
  pull_request:
      branches:
        - main
  workflow_dispatch: # Déclencheur manuel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/dev') && !startsWith(github.ref, 'refs/heads/test') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get Branch Name
        run: |
          if [[ -n "$GITHUB_HEAD_REF" ]]; then
            branch_name="${GITHUB_HEAD_REF}"
          else
            branch_name=$(git rev-parse --abbrev-ref HEAD)
          fi

          branch_sanitize=$(echo "$branch_name" | sed "s/\//-/g")

          echo "BRANCH_NAME=$branch_name" >> $GITHUB_ENV
          echo "BRANCH_SANITIZE=$branch_sanitize" >> $GITHUB_ENV
  
      - name: Build & Push Docker Image
        run: |
          #sed -i "s|\${AUTH_TOKEN}|${{ secrets.AUTH_TOKEN }}|g" ./resources/apps.json
          IMAGE_NAME="ghcr.io/devofs2/pro_erpnext_$BRANCH_SANITIZE:latest"
          echo "Building and pushing image: $IMAGE_NAME"
          echo "IMAGE_NAME=$IMAGE_NAME" >> .env
          echo "REGISTRY_PASSWORD=${{ secrets.GHCR_TOKEN }}" >> .env
          echo "REGISTRY_OWNER=${{ github.repository_owner }}" >> .env
          echo "BRANCH_NAME=$BRANCH_NAME" >> .env
          cat .env

          # Remplacement des variables dans docker-compose.yml
          sed -i "s|\${IMAGE_NAME}|$IMAGE_NAME|g" docker-compose.yml
          # sed -i "s|\${REGISTRY_PASSWORD}|${{ secrets.GHCR_TOKEN }}|g" docker-compose.yml
      

      - name: Upload Docker Compose & Env Files
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-files
          path: |
            docker-compose.yml
            .env
            .github/scripts/  
          overwrite: true
          include-hidden-files: true

  deploy-app:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      COOLIFY_URL: https://coolify2.ofs.bj
      COOLIFY_API_KEY: 1|6rnyiYLZtJRXYwiyiVRv3m3ytr6GOGspcTKoC4HTa8e42f6f
      PROJECT_UUID: "v0ggs00w4kgskcksgkgkk8oc"
    steps:
      - name: Download Docker Compose & Env Files
        uses: actions/download-artifact@v4
        with:
          name: docker-compose-files
          path: .
      
      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Load .env file
        run: |
          set -o allexport
          source .env
          set +o allexport

      - name: Replace variables in script
        run: |
          sed -i "s|\${REGISTRY_PASSWORD}|$REGISTRY_PASSWORD|g" .github/scripts/create_application.sh
          sed -i "s|\${GHRC_OWNER}|$GHRC_OWNER|g" .github/scripts/create_application.sh
          sed -i "s|\${IMAGE_NAME}|$IMAGE_NAME|g" .github/scripts/create_application.sh

      - name: Display the updated script
        run: |
          cat .github/scripts/create_application.sh

