name: Get Branch Name

on:
  push:
    branches:
      - '**'  # Pour toutes les branches
  pull_request:
    branches:
      - '**'  # Pour toutes les PR

jobs:
  get-branch-name:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.get-branch-name.outputs.branch_name }}  # Définir la sortie

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up the branch name script
        id: get-branch-name  # Ajouter un identifiant pour le step
        run: |
          echo '#!/bin/bash' > get-branch-name.sh
          echo 'if [[ -n "$GITHUB_HEAD_REF" ]]; then' >> get-branch-name.sh
          echo '    branch_name="${GITHUB_HEAD_REF}"' >> get-branch-name.sh
          echo 'else' >> get-branch-name.sh
          echo '    branch_name=$(git rev-parse --abbrev-ref HEAD)' >> get-branch-name.sh
          echo 'fi' >> get-branch-name.sh
          echo 'branch_name=$(echo "$branch_name" | sed "s/\//-/g")' >> get-branch-name.sh
          echo 'echo "Nom de la branche : $branch_name"' >> get-branch-name.sh
          echo "::set-output name=branch_name::$branch_name" >> get-branch-name.sh  # Définir l'output de la variable
          chmod +x get-branch-name.sh

      - name: Run branch name script
        run: ./get-branch-name.sh

  use-branch-name:
    runs-on: ubuntu-latest
    needs: get-branch-name  # Ce job dépend de celui de "get-branch-name"
    env:
      BRANCH_NAME: ${{ needs.get-branch-name.outputs.branch_name }}  # Utiliser l'output du job précédent comme variable d'environnement

    steps:
      - name: Display branch name
        run: |
          echo "La branche est : $BRANCH_NAME"
