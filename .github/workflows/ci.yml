name: Get Branch Name

on:
  push:
    branches:
      - '**'  # Pour toutes les branches
  pull_request:
    branches:
      - '**'  # Pour toutes les PR

jobs:
  get-branch-name:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up the branch name script
        id: get-branch-name
        run: |
          # Récupérer le nom de la branche
          if [[ -n "$GITHUB_HEAD_REF" ]]; then
            branch_name="${GITHUB_HEAD_REF}"
          else
            branch_name=$(git rev-parse --abbrev-ref HEAD)
          fi

          # Remplacer "/" par "-"
          branch_name=$(echo "$branch_name" | sed "s/\//-/g")

          # Afficher le nom de la branche et le définir comme variable d'environnement
          echo "Nom de la branche : $branch_name"
          echo "BRANCH_NAME=$branch_name" >> $GITHUB_ENV  # Définir la variable d'environnement pour tout le pipeline
          
      - name: Use BRANCH_NAME
        run: |
          echo "La branche est : $BRANCH_NAME"  # Utiliser la variable BRANCH_NAME dans un autre step

      - name: Create .env file with "hello"
        run: |
          echo "IMAGE_NAME=image:latest" >> .env
          echo "REGISTRY_PASSWORD=hello" >> .env
          echo "BRANCH_NAME=ci" >> .env
          cat .env

      - name: Upload .env file
        uses: actions/upload-artifact@v4
        with:
          name: env-file
          path: .env
          include-hidden-files: true

  download:
    runs-on: ubuntu-latest
    needs: get-branch-name

    steps:
      - name: Download .env file
        uses: actions/download-artifact@v4
        with:
          name: env-file
          path: .

      - name: Check downloaded .env file
        run: |
          cat .env
          cat .env >> $GITHUB_ENV
          echo $BRANCH_NAME
          echo $REGISTRY_PASSWORD

  another-job:
    runs-on: ubuntu-latest
    needs: get-branch-name  # Ce job dépend du job "get-branch-name"

    steps:
      - name: Use BRANCH_NAME in another job
        run: |
          echo "Dans un autre job, la branche est : $BRANCH_NAME"

